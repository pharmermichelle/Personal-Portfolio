<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fallen Grid Prototype</title>
  <link rel="stylesheet" href="style.css">

    <!-- AdSense: responsive display advertisement -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9258275639543826" crossorigin="anonymous"></script>
  </head>
<body>
  <div class="game-shell">
    <header class="top-bar">
      <h1>Fallen Grid</h1>
      <button id="restartBtn">Restart</button>
    </header>

    <section class="hud">
      <div>Level: <span id="level">1</span> / 30</div>
      <div>Lines: <span id="lines">0</span></div>
      <div>Score: <span id="score">0</span></div>
    </section>

    <canvas id="game" width="320" height="640"></canvas>

    <section class="touch-controls" aria-label="Game controls">
  <button type="button" id="leftBtn" aria-label="Move left">◀</button>
  <button type="button" id="rotateBtn" aria-label="Rotate">⟳</button>
  <button type="button" id="rightBtn" aria-label="Move right">▶</button>
  <button type="button" id="downBtn" aria-label="Move down">▼</button>
  <button type="button" id="dropBtn" class="wide">DROP</button>
</section>

    <section class="controls">
      <h2>Controls</h2>
      <p>Desktop: ← → move, ↑ rotate, ↓ soft drop, space hard drop.</p>
      <p>Mobile: use the buttons under the board.</p>
    </section>
  </div>

  <script src="game.js"></script>

    <!-- Responsive ad below gameplay; never overlays game controls. -->
    <section aria-label="Advertisement" style="box-sizing:border-box;width:100%;max-width:980px;margin:32px auto 24px;padding:14px 12px 20px;text-align:center;clear:both;flex-shrink:0;min-height:110px;border-top:1px solid rgba(128,128,128,.35);">
      <p style="font:12px/1.5 system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;opacity:.7;margin:0 0 12px;">Advertisement</p>
      <ins class="adsbygoogle" style="display:block;width:100%;" data-ad-client="ca-pub-9258275639543826" data-ad-slot="4366267404" data-ad-format="auto" data-full-width-responsive="true"></ins>
    </section>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
</body>
</html>
