<h1>🏒 Hockey Gear Rush</h1>

<div id="game">
<div id="missionBox">
  <h2>🏒 Gear Checklist</h2>
  <ul id="targetList"></ul>
</div>
<div id="timer"></div>
<div id="levelInfo">Level 1</div>
<div id="lateInfo"></div>
  <div id="pileArea"></div>
  <button onclick="startGame()">Start Round</button>
  <div id="message"></div>
</div>

<script>

const gear = [
  { name: "helmet", label: "Helmet", img: "assets/gear/helmet.png" },
  { name: "glove", label: "Glove", img: "assets/gear/glove.png" },
  { name: "skates", label: "Ice Skates", img: "assets/gear/skates.png" },
  { name: "stick", label: "Hockey Stick", img: "assets/gear/stick.png" },
  { name: "puck", label: "Puck", img: "assets/gear/puck.png" },
  { name: "net", label: "Net", img: "assets/gear/net.png" },
  { name: "shin-pad", label: "Shin Pad", img: "assets/gear/shin_pad.png" },
  { name: "elbow-pad", label: "Elbow Pad", img: "assets/gear/elbow_pad.png" },
  { name: "chest-pad", label: "Chest Pad", img: "assets/gear/chest_pad.png" },
  { name: "jersey", label: "Jersey", img: "assets/gear/jersey.png" }
];

const filler = ["⭐","🔥","❄️","🍎","🎯","🍀","🌟","💥"];

 let targetItems = [];
let foundItems = [];
let time = 0;
let timer;
let level = 1;
let mode = "gear";
let cleanupItemsLeft = 0;

const levels = [
  { level: 1, targets: 4, clutter: 34, suggestedTime: 15 },
  { level: 2, targets: 5, clutter: 42, suggestedTime: 20 },
  { level: 3, targets: 6, clutter: 50, suggestedTime: 25 },
  { level: 4, targets: 7, clutter: 58, suggestedTime: 30 },
  { level: 5, targets: 8, clutter: 66, suggestedTime: 35 }
];

function randomItem(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function buildGrid() {
  const pile = document.getElementById("pileArea");
  pile.innerHTML = "";

  let items = [];

  targetItems = [];
  const levelData = levels[level - 1] || levels[levels.length - 1];

  // PICK 4 UNIQUE TARGET GEAR ITEMS
  while (targetItems.length < levelData.targets) {
    let item = randomItem(gear);

    if (!targetItems.find(t => t.name === item.name)) {
      targetItems.push(item);
      items.push({ ...item, isTarget: true });
    }
  }

  // RANDOM BEDROOM CLUTTER
  const clutter = [
    "🧸","🛹","🎧","📚","🧦","🍕","🥤","🎮",
    "🧢","📱","🪥","🧃","🍌","🕹️","🪀","📸",
    "🧼","🧴","🛼","🪁","🎲","🪙","🔋","💡",
    "🧻","🧢","🪑","🎨","📦","🪥","🧸","🎒"
  ];

  // ADD LOTS OF CLUTTER
  while (items.length < levelData.clutter) {
    items.push({
      type: "clutter",
      emoji: randomItem(clutter)
    });
  }

  // SHUFFLE EVERYTHING
  items.sort(() => Math.random() - 0.5);

  items.forEach((item, index) => {
    const button = document.createElement("button");
    button.className = "pile-item";

    const maxX = pile.clientWidth - 70;
const maxY = pile.clientHeight - 70;
const x = Math.random() * maxX;
const y = Math.random() * maxY;
    const rotate = Math.random() * 100 - 50;

    button.style.left = x + "px";
    button.style.top = y + "px";
    button.style.transform = `rotate(${rotate}deg)`;
    button.style.zIndex = index + 1;

    // HOCKEY GEAR
    if (item.img) {
      const img = document.createElement("img");
      img.src = item.img;
      img.alt = item.label;

      button.appendChild(img);

      button.addEventListener("click", () =>
        handleClick(button, item)
      );
    }

    // CLUTTER EMOJIS
    else {
      button.textContent = item.emoji;
      button.classList.add("clutter-item");
    }

    makeDraggable(button);

    pile.appendChild(button);
  });

renderTargetList();
}


function renderTargetList() {
  const list = document.getElementById("targetList");
  list.innerHTML = "";

  targetItems.forEach(item => {
    const li = document.createElement("li");
    li.id = "target-" + item.name;

    li.innerHTML = `
      <img class="checklist-gear-img" src="${item.img}" alt="${item.label}">
      <span>${item.label}</span>
      <span class="checkmark">⬜</span>
    `;

    list.appendChild(li);
  });
}


function makeDraggable(item) {
  let isDragging = false;
  let startX = 0;
  let startY = 0;
  let itemX = 0;
  let itemY = 0;

  item.addEventListener("pointerdown", e => {
    isDragging = true;
    item.setPointerCapture(e.pointerId);

    startX = e.clientX;
    startY = e.clientY;

    itemX = parseFloat(item.style.left) || 0;
    itemY = parseFloat(item.style.top) || 0;

    item.style.zIndex = 999;
    item.style.cursor = "grabbing";
  });

  item.addEventListener("pointermove", e => {
    if (!isDragging) return;

    const dx = e.clientX - startX;
    const dy = e.clientY - startY;

    item.style.left = itemX + dx + "px";
    item.style.top = itemY + dy + "px";
  });

  item.addEventListener("pointerup", e => {
    isDragging = false;
    item.releasePointerCapture(e.pointerId);
    item.style.cursor = "grab";
  });
}

function handleClick(cell, item) {
  const isTarget = targetItems.find(t => t.name === item.name);

  if (isTarget && !cell.classList.contains("found")) {
    cell.classList.add("found");
    foundItems.push(item.name);

    cell.style.opacity = "0.25";
    cell.style.pointerEvents = "none";

    const listItem = document.getElementById("target-" + item.name);

    if (listItem) {
      listItem.classList.add("collected");
      listItem.querySelector(".checkmark").textContent = "✅";
    }

    if (foundItems.length === targetItems.length) {
      endGame(true);
    }
  }
}

function startGame() {
  mode = "gear";
  foundItems = [];
  time = 0;

  const levelData = levels[level - 1] || levels[levels.length - 1];

  document.getElementById("message").textContent = "";
  document.getElementById("levelInfo").textContent = "Level " + level;
  document.getElementById("lateInfo").textContent =
    "Suggested time: " + levelData.suggestedTime + " seconds. Go over and you clean the room!";

  buildGrid();
  updateTimer();

  clearInterval(timer);

  document.getElementById("pileArea").classList.add("paused");

  document.getElementById("popupTitle").textContent = "🏒 Level " + level;
  document.getElementById("popupDetails").innerHTML =
    "Find <strong>" + levelData.targets + "</strong> pieces of hockey gear.<br>" +
    "Messy items in the way: <strong>" + (levelData.clutter - levelData.targets) + "</strong><br>" +
    "Beat it in <strong>" + levelData.suggestedTime + " seconds</strong> or clean the room after.";

  document.getElementById("levelPopup").classList.remove("hidden");
}

function beginLevelTimer() {
  document.getElementById("levelPopup").classList.add("hidden");
  document.getElementById("pileArea").classList.remove("paused");

  clearInterval(timer);
  timer = setInterval(() => {
    time++;
    updateTimer();
  }, 1000);
}

function updateTimer() {
  document.getElementById("timer").textContent = "Time: " + time;
}

function endGame(win) {
  clearInterval(timer);

  const levelData = levels[level - 1] || levels[levels.length - 1];
  const lateSeconds = Math.max(0, time - levelData.suggestedTime);

  if (win && lateSeconds > 0) {
    document.getElementById("message").textContent =
      "⏰ You found the gear, but you were " + lateSeconds + 
      " seconds late. Time to clean this messy room!";
    
    setTimeout(() => startCleanupMiniGame(lateSeconds), 1200);
    return;
  }

  if (win) {
    document.getElementById("message").textContent =
      "🏆 Great job! You beat the clock and made it to the game on time!";

    level++;
    setTimeout(startGame, 1300);
    return;
  }

  document.getElementById("message").textContent =
    "⏰ Time got away from you. Clean the room before trying again!";

  setTimeout(() => startCleanupMiniGame(5), 1200);
}

function startCleanupMiniGame(lateSeconds) {
  mode = "cleanup";
  clearInterval(timer);

  const pile = document.getElementById("pileArea");
  pile.innerHTML = "";

  document.getElementById("targetList").innerHTML = "";
  document.getElementById("timer").textContent = "Cleanup!";
  document.getElementById("levelInfo").textContent = "Room Cleanup Mini Game";

  cleanupItemsLeft = Math.min(12, Math.max(4, lateSeconds));

  document.getElementById("lateInfo").textContent =
    "Clean up " + cleanupItemsLeft + " messy items to continue.";

  document.getElementById("message").textContent =
    "Tap the messy stuff to clean it up!";

  const trash = ["🧦","🍕","🥤","📚","🧸","🎮","🪥","🧃","🍌","📦","🧻","🎒"];

  for (let i = 0; i < cleanupItemsLeft; i++) {
    const button = document.createElement("button");
    button.className = "pile-item trash-item";
    button.textContent = randomItem(trash);

    const maxX = pile.clientWidth - 60;
const maxY = pile.clientHeight - 60;

button.style.left = Math.random() * maxX + "px";
button.style.top = Math.random() * maxY + "px";
    button.style.transform = `rotate(${Math.random() * 80 - 40}deg)`;
    button.style.zIndex = i + 1;

    button.addEventListener("click", () => {
      if (button.classList.contains("cleaned")) return;

      button.classList.add("cleaned");
      cleanupItemsLeft--;

      document.getElementById("lateInfo").textContent =
        "Messy items left: " + cleanupItemsLeft;

      if (cleanupItemsLeft <= 0) {
        document.getElementById("message").textContent =
          "🧹 Room cleaned! Back to finding gear.";

        level++;
        setTimeout(startGame, 1200);
      }
    });

    pile.appendChild(button);
  }
}
</script>
