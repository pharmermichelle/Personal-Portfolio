name: Store Claws vs Paws OpenArt character sprites
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/claws-character-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-sprites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch OpenArt sprites into game assets
        env:
          LION_URL: 'https://cdn.openart.ai/watermarked_images/MbzZ6EMIad2YIAtZGbAq/thumbnail_0156bcd1_1794688671757.webp'
          TABBY_URL: 'https://cdn.openart.ai/watermarked_images/MbzZ6EMIad2YIAtZGbAq/thumbnail_18432033_1794689150801.webp'
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          import os, io, urllib.request
          from pathlib import Path
          from PIL import Image
          folder=Path('minigame/claws-vs-paws/assets')
          folder.mkdir(parents=True, exist_ok=True)
          for name,envkey in [('lionheart-captain','LION_URL'),('tabby-squire','TABBY_URL')]:
              target=folder/(name+'.webp')
              request=urllib.request.Request(os.environ[envkey],headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(request,timeout=45) as response:
                  data=response.read()
              image=Image.open(io.BytesIO(data))
              image.load()
              assert image.width>=256 and image.height>=256, 'Unexpected small image'
              image=image.convert('RGBA')
              image.thumbnail((1024,1024),Image.Resampling.LANCZOS)
              image.save(target,format='WEBP',quality=90,method=6)
              print(name,target.stat().st_size,'bytes')
          PY
      - name: Commit game-owned artwork
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add minigame/claws-vs-paws/assets/lionheart-captain.webp minigame/claws-vs-paws/assets/tabby-squire.webp
          if git diff --cached --quiet; then
            echo 'Both images are already committed'
            exit 0
          fi
          git commit -m 'Add local OpenArt Lionheart and Tabby character sprites'
          git pull --rebase origin main
          git push origin HEAD:main
